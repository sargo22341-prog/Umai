org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP uninstalls both APKs once instrumented tests are done, which would erase the
# configured Mealie instance and session of the debug build on the test phone. The
# option is read as `android-test.uninstall-after-tests = !leaveApksInstalledAfterRun`,
# so setting it here keeps the app — and its data — in place after the run.
android.injected.androidTest.leaveApksInstalledAfterRun=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

