name: Regen verification metadata (temporaire)
on:
  push:
    branches: [claude/dreamy-hypatia-vn3sge]
    paths: ['.github/workflows/regen-verification.yml']
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Regenerate
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --write-verification-metadata sha256 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintRelease :app:compileDebugAndroidTestKotlin --console=plain || echo "BUILD EXIT $?"
          echo "=====DIFF-BEGIN====="
          git diff --no-color -U0 gradle/verification-metadata.xml
          echo "=====DIFF-END====="
