# Compilation (debug et release), Lint et tests JVM sur chaque pull request et chaque push.
# Les actions sont épinglées par SHA de commit (le tag lisible en commentaire) : le job de
# release écrit dans le dépôt et manipule la clé de signature.
# --dependency-verification off : verification-metadata.xml, généré sous Windows, n'a pas les
# artefacts propres à Linux ; les sommes de contrôle sont vérifiées en local (AGENTS.md §2).
# Pas de job émulateur : l'émulateur Android 17 plante sur les runners Linux ; les tests instrumentés
# se lancent sur un appareil (AGENTS.md §12).
# Sur main : montée de version, APK release signé, commit + tag vX.Y.Z et GitHub Release
# dont le texte vient de RELEASE_NOTES.md (liste vidée dans le commit de version).
# Fonctionnement, secrets requis et limites : docs/release.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Un changement de documentation ou de tests seuls ne publie pas de nouvel APK.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
  workflow_dispatch:
    inputs:
      bump:
        description: Partie de la version à incrémenter
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  verify:
    name: Compilation et tests
    # Gitea/Forgejo Actions lisent aussi .github/workflows : le dépôt miroir local n'exécute rien.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compiler, analyser et lancer les tests JVM
        run: |
          chmod +x gradlew
          # La release (R8, règles ProGuard) est construite dès la pull request, non signée :
          # ses erreurs apparaissent avant la fusion, pas dans le job de release.
          ./gradlew --dependency-verification off :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:compileDebugAndroidTestKotlin --console=plain

      - name: Vérifier l'absence de Google Play Services, Firebase et Maps
        run: |
          # AGENTS.md §2 : l'app tourne sans GMS (GrapheneOS). Le graphe de la release fait foi,
          # même quand R8 renomme les classes.
          ./gradlew --dependency-verification off :app:dependencies --configuration releaseRuntimeClasspath --console=plain -q > "$RUNNER_TEMP/deps.txt"
          if grep -E "com\.google\.android\.gms|com\.google\.firebase|com\.google\.android\.maps" "$RUNNER_TEMP/deps.txt"; then
            echo "::error::Une dépendance tire Google Play Services, Firebase ou Maps."
            exit 1
          fi

      - name: Conserver les rapports de tests et de Lint
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-de-tests
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  release:
    name: Montée de version et APK signé
    needs: [verify]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Deux montées de version en parallèle produiraient le même numéro.
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      KEYSTORE_BASE64: ${{ secrets.UMAI_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.UMAI_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.UMAI_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.UMAI_KEY_PASSWORD }}
    steps:
      - name: Vérifier les secrets de signature
        run: |
          # Jamais de release non signée : sans clé, le job s'arrête avant toute montée de version.
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(UMAI_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(UMAI_KEYSTORE_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Secrets manquants : ${missing[*]} (voir docs/release.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Monter la version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          bash scripts/bump-version.sh "$BUMP"
          tag="v$(sed -n 's/^versionName=//p' app/version.properties)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Le tag $tag existe déjà."
            exit 1
          fi

      - name: Relever puis vider les notes de version
        id: notes
        run: |
          # Les notes partent dans la release ; la liste vidée part dans le commit de version.
          notes="$RUNNER_TEMP/release-notes.md"
          bash scripts/release-notes.sh extract "$notes"
          bash scripts/release-notes.sh reset
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK release
        run: |
          chmod +x gradlew
          ./gradlew --dependency-verification off :app:assembleRelease --console=plain

      - name: Vérifier l'APK sans Google Play Services
        run: |
          apk=$(ls app/build/outputs/apk/release/*-release-unsigned.apk)
          if unzip -l "$apk" | grep -E "com/google/android/gms|com/google/firebase|com/google/android/maps"; then
            echo "::error::L'APK release embarque Google Play Services, Firebase ou Maps."
            exit 1
          fi

      - name: Signer et vérifier l'APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          keystore="$RUNNER_TEMP/umai-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"

          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          unsigned=$(ls app/build/outputs/apk/release/*-release-unsigned.apk)
          apk="$RUNNER_TEMP/umai-$VERSION_NAME.apk"

          args=(--ks "$keystore" --ks-key-alias "${KEY_ALIAS:-umai}" --ks-pass env:KEYSTORE_PASSWORD)
          if [[ -n "$KEY_PASSWORD" ]]; then
            args+=(--key-pass env:KEY_PASSWORD)
          fi
          "$build_tools/apksigner" sign "${args[@]}" --out "$apk" "$unsigned"
          "$build_tools/apksigner" verify --print-certs "$apk"

          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Supprimer la clé du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/umai-release.keystore"

      - name: Commit et tag de la version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $VERSION_NAME [skip ci]"
          git tag -a "v$VERSION_NAME" -m "umai $VERSION_NAME"
          # Atomique : si main a avancé pendant le build, ni le commit ni le tag ne sont poussés.
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION_NAME"

      - name: Publier la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          if [[ -s "$NOTES" ]]; then
            notes=(--notes-file "$NOTES")
          else
            notes=(--generate-notes)
          fi
          gh release create "v$VERSION_NAME" "$APK" --title "umai $VERSION_NAME" "${notes[@]}"
